spring.application.name=newsapp

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

debug=false
groq.api.key=${GROQ_API_KEY}

app.cookie.secure=true
app.cookie.samesite=None

server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.redirect-url=${FRONTEND_REDIRECT_URL}


logging.level.org.springframework.cache=WARN
logging.level.root=WARN

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

spring.cache.type=redis

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.scheduler.auto-fetch.enabled=false

server.error.include-message=never

newsapp.jwt.secret=${JWT_SECRET}
newsapp.jwt.expiration=${JWT_EXPIRATION:864000000}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.metrics.enable.all=true
