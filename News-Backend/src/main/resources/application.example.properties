
spring.application.name=newsapp
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://<host>:<port>/<database_name>
spring.datasource.username=<your-db-username>
spring.datasource.password=<your-db-password>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

debug=true

# Groq API
groq.api.key=<your-groq-api-key>

# Redis Configuration
spring.data.redis.host=<redis-host>
spring.data.redis.port=6379
spring.data.redis.password=<redis-password-if-any>
spring.cache.type=redis

# Mail Configuration (Gmail App Password use karo, normal password nahi)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<your-email>
spring.mail.password=<your-16-digit-app-password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduler: local mein true, production mein false
app.scheduler.auto-fetch.enabled=true

server.error.include-message=always

# JWT Config (kam se kam 256-bit strong key)
newsapp.jwt.secret=<your-256-bit-secret-key>
newsapp.jwt.expiration=864000000

# GOOGLE OAUTH2 CONFIG
spring.security.oauth2.client.registration.google.client-id=<your-google-client-id>
spring.security.oauth2.client.registration.google.client-secret=<your-google-client-secret>
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# GITHUB OAUTH2 CONFIG
spring.security.oauth2.client.registration.github.client-id=<your-github-client-id>
spring.security.oauth2.client.registration.github.client-secret=<your-github-client-secret>
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# ACTUATOR METRICS CONFIGURATION
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.metrics.enable.all=true
